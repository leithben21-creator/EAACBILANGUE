name: Build EAAC APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Installer les dépendances
        run: npm install
      - name: Créer le projet Android
        run: npx cap add android
      - name: Permissions GPS + caméra + écran allumé / plein écran
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n</manifest>#' "$M"
          grep -q ACCESS_FINE_LOCATION "$M"
          cp android-patch/MainActivity.java android/app/src/main/java/dz/eaac/artillerie/MainActivity.java
      - name: Icônes
        continue-on-error: true
        run: npx capacitor-assets generate --android
      - name: Copier le site
        run: npx cap sync android
      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EAAC-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
