<html lang="fr"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box}body{margin:0;background:var(--PANEL);color:var(--TEXT);font:14px Consolas,"Courier New",monospace;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.bar{background:var(--GREEN_D);border-bottom:2px solid var(--AMBER_D);color:var(--AMBER);text-align:center;padding:5px;font-weight:700;font-size:11px;letter-spacing:1px}
.hero{background:var(--GREEN_D);text-align:center;padding:12px 6px;border-bottom:2px solid var(--AMBER_D)}
.hero h1{margin:0;font-size:34px;letter-spacing:10px;color:var(--AMBER)}.hero div{font-size:10px;font-weight:700;color:var(--DIM)}
.wrap{max-width:900px;margin:auto;padding:8px}
.box{border:2px solid var(--AMBER_D);background:var(--BG);border-radius:4px;margin:8px 0;position:relative;padding:14px 8px 8px}
.box>h3{position:absolute;top:-10px;left:12px;margin:0;background:var(--PANEL);padding:0 8px;font-size:12px;color:var(--AMBER);letter-spacing:1px}
.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{width:220px;height:130px;border:3px solid var(--DARK);background:var(--DARK) center/cover no-repeat;position:relative;cursor:pointer;border-radius:3px;overflow:hidden}
.card.sel{border-color:var(--c)}.card .mx{position:absolute;top:0;left:0;right:0;background:#001408cc;color:#8a9;font-size:11px;font-weight:700;padding:2px 5px}
.card .tt{position:absolute;bottom:0;left:0;right:0;background:#050e03d0;text-align:center;padding:3px 0}.card .tt b{display:block;font-size:14px;color:var(--c)}.card .tt small{font-size:10px;color:#9a9;font-weight:700}
.foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;background:var(--GREEN_D);border-top:2px solid var(--AMBER_D);padding:8px;margin-top:10px}
button{font:700 13px Consolas,monospace;background:var(--GREEN_D);color:var(--TEXT);border:2px solid var(--GREEN);border-radius:5px;padding:9px 12px;cursor:pointer}
button.on{background:var(--GREEN);color:var(--BRT);border-color:var(--c,var(--AMBER))}button.a{background:var(--AMBER_D);color:var(--BRT);border-color:var(--AMBER)}
button.big{width:100%;padding:15px;font-size:17px;background:var(--AMBER_D);border-color:var(--AMBER);color:var(--BRT);margin:8px 0}
label{display:block;font-size:11px;color:var(--DIM);margin:5px 0 1px;font-weight:700}
input,select{width:100%;padding:11px 8px;background:var(--DARK);color:var(--CYANI);border:2px solid var(--AMBER_D);border-radius:6px;font:700 16px Consolas,monospace}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.top{display:flex;align-items:center;gap:8px;background:var(--GREEN_D);padding:6px 8px;border-bottom:2px solid var(--AMBER_D)}.top b{color:var(--AMBER);flex:1;letter-spacing:1px}
.rb{margin:6px 0;border:2px solid var(--c)}.rb .h{background:var(--c);color:#000;font-weight:700;padding:5px 8px}.rb .in{background:var(--BG);padding:6px 4px}
.vals{display:flex;gap:4px}.vals>div{flex:1;min-width:0;padding:0 4px}.vals small{display:block;color:var(--DIM);font-size:11px;font-weight:700}
.vals b{display:block;background:var(--DARK);color:var(--NUM);font-size:var(--fs,22px);padding:1px 4px;white-space:nowrap;overflow:hidden}
.ft{background:var(--FT);border-top:2px solid var(--c)}.ft .t{background:var(--FT2);color:var(--FTT);padding:5px 8px;font-weight:700;font-size:12px}
.ft .vals b{background:transparent;--fs:28px}.ft .vals small{font-size:12px}.ft u{text-decoration:none;font-size:11px;color:var(--DIM)}
.warn{color:var(--ORANGE);padding:6px 8px;font-weight:700}.hdrc{background:var(--GREEN_D);color:var(--AMBER);padding:6px 8px;font-weight:700;display:flex;justify-content:space-between}
.sub{padding:4px 8px;color:var(--AMBER);font-size:12px}canvas{width:100%;background:var(--DARK);border-radius:4px}
.hid{display:none}table{width:100%;border-collapse:collapse}td{padding:5px;border-bottom:1px solid var(--AMBER_D)}
.modal{position:fixed;inset:0;background:#000c;z-index:9;padding:20px;overflow:auto}.modal pre{background:var(--PANEL);color:var(--TEXT);padding:14px;border:2px solid var(--AMBER);white-space:pre-wrap;font-size:12px}
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

.leaflet-control-layers-expanded .leaflet-control-layers-list {

	}

	padding: 6px 10px 6px 6px;

	background: #fff;
	}
.leaflet-control-layers-scrollbar {
	overflow-y: scroll;
	overflow-x: hidden;
	padding-right: 5px;
	}

	margin-top: 2px;

	top: 1px;
	}
.leaflet-control-layers label {
	display: block;
	font-size: 13px;
	font-size: 1.08333em;
	}
.leaflet-control-layers-separator {
	height: 0;
	border-top: 1px solid #ddd;
	margin: 5px -10px 5px -6px;
	}

/* Default icon URLs */
.leaflet-default-icon-path { /* used only in path-guessing heuristic, see L.Icon.Default */
	background-image: url(images/marker-icon.png);
	}


/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);
	margin: 0;
	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;
	color: #333;
	line-height: 1.4;
	}
.leaflet-control-attribution a {
	text-decoration: none;
	}
.leaflet-control-attribution a:hover,
.leaflet-control-attribution a:focus {
	text-decoration: underline;
	}
.leaflet-attribution-flag {
	display: inline !important;
	vertical-align: baseline !important;
	width: 1em;
	height: 0.6669em;
	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;
	}
.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;
	}
.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;
	line-height: 1.1;
	padding: 2px 5px 1px;
	white-space: nowrap;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	background: rgba(255, 255, 255, 0.8);
	text-shadow: 1px 1px #fff;
	}

	border-top: 2px solid #777;
	border-bottom: none;
	margin-top: -2px;
	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {
	border-bottom: 2px solid #777;
	}

.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {

function guide(){ov("📖 MODE D'EMPLOI",`<div class="wrap gd">
<details open><summary>Démarrage rapide</summary><ol><li>Choisir le <b>système</b> (2C1, 2C3, D-30).</li><li>Choisir la <b>méthode</b> : DRONE, TÉLÉMÈTRE ou OBS. CROISÉE.</li><li>Saisir les données puis <b>▶ CALCULER</b>.</li><li><b>CHARGE</b> : <b>AUTO</b> (choisie selon la distance) ou <b>MANUEL</b> (vous choisissez la charge dans la liste ; si la portée est hors plage, les charges compatibles sont proposées).</li></ol></details>
<details><summary>Formats de saisie</summary><ul><li><b>GEO</b> : « DD MM SS.ss », ex. 36 11 24.00 (négatif pour Sud / Ouest).</li><li><b>UTM</b> : Easting, Northing, Zone. Le bouton GEO/UTM convertit les valeurs.</li><li><b>📍 GPS</b> : remplit le point avec la position du téléphone (autoriser la localisation). La précision s'affiche.</li><li><b>Azimuts</b> : en mil (cercle de 6000 mil).</li></ul></details>
<details><summary>Méthode DRONE</summary><ul><li>Renseigner PT (position de tir) et CIBLE (but relevé par le drone), en GEO ou UTM.</li><li>PO (poste d'observation) est facultatif : bouton SKIP pour l'ignorer.</li></ul></details>
<details><summary>Méthode TÉLÉMÈTRE</summary><ul><li>PO et PT en UTM.</li><li>But : distance (m) et azimut (mil) mesurés depuis le PO.</li></ul></details>
<details><summary>Méthode OBS. CROISÉE</summary><ul><li>PO1, PO2 et PT en UTM.</li><li>Azimut (mil) de chaque PO vers le but : le but est à l'intersection des deux azimuts.</li><li>Azimuts parallèles = pas d'intersection (message d'erreur).</li></ul></details>
<details><summary>Lire les résultats</summary><ul><li><b>DBT</b> distance PT-but, <b>α but PT</b> azimut, <b>pBT</b> et <b>Ps / KY</b> si un PO est saisi.</li><li><b>Table de tir</b> : charge, hausse, pBC, Z (dérive). L'encadré « ORDRE DE TIR » se copie ou se partage.</li><li><b>ALPHA DP</b> : direction principale en mil, utilisée pour pBT / pBC.</li></ul></details>
<details><summary>Éclatements et corrections</summary><ul><li><b>+ AJOUTER UN ÉCLATEMENT</b> puis CALCULER : ΔD (raccourcir / allonger) et ΔP (droite / gauche) par rapport au but.</li><li><b>🎯 CALCUL DE CORRECTION (H &amp; P)</b> donne la hausse et la pBC corrigées.</li></ul></details>
<details><summary>Hauteurs, site et trajectoire</summary><ul><li><b>⛰ HAUTEURS &amp; SITE</b> : altitudes PT / but depuis un DEM (.tif chargé du téléphone, ou mode AUTO avec Internet).</li><li>Profil topographique, site et trajectoire balistique s'ouvrent depuis cet écran.</li></ul></details>
<details><summary>Carte et pointage</summary><ul><li><b>🗺</b> (barre du haut) ou <b>CROQUIS</b> ouvre la carte, <u>même avant de calculer</u>.</li><li>Choisir PT, PO, BUT ou ÉCLAT, puis toucher la carte : les champs se remplissent. NAVIGUER déplace la carte sans rien placer.</li><li><b>📍 GPS</b> centre la carte sur votre position. <b>📂 CARTE .tif</b> ajoute une carte hors ligne.</li></ul></details>
<details><summary>Sauvegarder, exporter, reprendre</summary><ul><li><b>💾 SAUVEGARDER</b> ajoute la cible à l'historique. Toucher une cible : la recharger, la renommer ou la supprimer.</li><li><b>Fiche PDF / IMAGE</b> : une page avec ordre de tir, coordonnées, corrections et croquis, à partager ou imprimer.</li><li><b>KML</b> (Google Earth) et <b>GPX</b> (applis de navigation) exportent PT, PO, but et éclatements.</li><li><b>💾 SAUVEGARDE (.json)</b> / <b>📥 RESTAURER</b> : copie complète de l'historique (changement de téléphone).</li><li><b>Saisie en cours</b> : la saisie est gardée automatiquement. Si l'application se ferme, « ▶ REPRENDRE » apparaît dans le menu.</li></ul></details>
<details><summary>Boussole (mil)</summary><ul><li><b>🧭 BOUSSOLE</b> sous chaque champ d'azimut (télémètre, obs. croisée, éclatements) : le capteur du téléphone donne l'azimut en mil, <b>✔ UTILISER</b> le recopie dans le champ.</li><li>Réglez la <b>déclinaison</b> (mil) : le capteur mesure le nord magnétique. À plat : bord haut vers le but. Debout : dos du téléphone vers le but.</li><li>Précision limitée : interférences métalliques, calibration en « 8 ». À contrôler avec une boussole militaire.</li></ul></details>
<details><summary>MGRS</summary><ul><li>Sous chaque point : champ <b>MGRS</b> (ex. 31S DA 12345 67890). <b>⬇ APPLIQUER</b> remplit GEO/UTM, <b>⬆ CALCULER</b> écrit le MGRS du point.</li><li>Le MGRS apparaît aussi sur le curseur de la carte, la fiche PDF et le plan de cibles (hémisphère Nord).</li></ul></details>
<details><summary>Cartes hors ligne et règle</summary><ul><li>Dans la carte : <b>📥 HORS LIGNE</b> enregistre la zone visible (max 400 tuiles, 3 niveaux de zoom) du fond actif. Les tuiles déjà vues restent aussi en mémoire.</li><li><b>🗺 CARTES HORS LIGNE</b> (menu → OUTILS) vide cette mémoire.</li><li>Pointage <b>📏 RÈGLE</b> : touchez deux points pour lire distance (m) et azimut (mil) aller / retour.</li></ul></details>
<details><summary>Plan de cibles</summary><ul><li>Menu → <b>📑 PLAN DE CIBLES</b> : cochez les cibles de l'historique, triez par heure, nom ou distance, puis exportez un <b>PDF récap</b> (plusieurs pages si besoin), un <b>KML</b> ou un <b>CSV</b>.</li></ul></details>
<details><summary>Partage par QR code</summary><ul><li>Après un calcul : <b>📲 QR</b> affiche la cible (PT, PO, but, éclatements, charge) en QR code.</li><li>Autre téléphone : menu → <b>📲 IMPORTER</b> → <b>📷 SCANNER</b> (ou collez le texte lu avec l'appareil photo). La cible s'ouvre en méthode DRONE, prête à calculer.</li></ul></details>
<details><summary>Code PIN</summary><ul><li>Menu → <b>🔒 CODE PIN</b> : code de 4 à 6 chiffres demandé à l'ouverture et après 20 s en arrière-plan. 5 erreurs = attente de 30 s ou plus.</li><li>Le code ne chiffre pas les données. Code oublié : « Code oublié ? » efface toutes les données de l'application.</li></ul></details>
<details><summary>À savoir</summary><ul><li>EAAC est une aide au calcul : toujours vérifier les éléments selon les procédures en vigueur.</li><li>Sans Internet, le calcul fonctionne ; seules les cartes en ligne et le DEM AUTO demandent une connexion.</li></ul></details></div>`)}

async function pinStore(p){const s=Math.random().toString(36).slice(2)+Date.now();localStorage.eaac_pin=JSON.stringify({s,h:await pinHash(p,s)})}
async function pinCheck(p){try{const o=JSON.parse(localStorage.eaac_pin);return!!o&&o.h===await pinHash(p,o.s)}catch(e){return false}}

function lockUI(msg){const el=$("lock"),w=lockWait();if(!el)return;el.innerHTML=`<div style="color:var(--AMBER);font-size:28px;font-weight:700;letter-spacing:6px">🔒 EAAC</div><div style="color:var(--DIM)">Entrez le code PIN</div><div style="font-size:34px;letter-spacing:12px;color:var(--NUM);min-height:44px">${"●".repeat(_pin.length)}</div><div style="color:#ff6b5e;min-height:20px;font-weight:700">${msg||(w?"Réessayez dans "+w+" s":"")}</div><div style="display:grid;grid-template-columns:repeat(3,78px);gap:10px">${[1,2,3,4,5,6,7,8,9,"⌫",0,"OK"].map(k=>`<button style="padding:18px 0;font-size:22px" onclick="pinKey('${k}')">${k}</button>`).join("")}</div><button style="margin-top:8px;font-size:11px" onclick="pinForgot()">Code oublié ?</button>`;if(w&&!msg)setTimeout(lockUI,1000)}

var GUIDE={
en:[["Quick start",1,"ol",["Choose the <b>system</b> (2C1, 2C3, D-30).","Choose the <b>method</b>: DRONE, RANGEFINDER or CROSS OBS.","Enter the data, then <b>▶ CALCULATE</b>.","<b>CHARGE</b>: <b>AUTO</b> (chosen according to the distance) or <b>MANUAL</b> (you choose the charge from the list; if the range is out of limits, the compatible charges are suggested)."]],
["Input formats",0,"ul",["<b>GEO</b>: “DD MM SS.ss”, e.g. 36 11 24.00 (negative for South / West).","<b>UTM</b>: Easting, Northing, Zone. The GEO/UTM button converts the values.","<b>📍 GPS</b>: fills the point with the phone position (allow location access). The accuracy is displayed.","<b>Azimuths</b>: in mil (6000-mil circle)."]],
["DRONE method",0,"ul",["Enter PT (firing position) and TARGET (target located by the drone), in GEO or UTM.","PO (observation post) is optional: use the SKIP button to ignore it."]],
["RANGEFINDER method",0,"ul",["PO and PT in UTM.","Target: distance (m) and azimuth (mil) measured from the PO."]],
["CROSS OBS. method",0,"ul",["PO1, PO2 and PT in UTM.","Azimuth (mil) from each PO to the target: the target is at the intersection of the two azimuths.","Parallel azimuths = no intersection (error message)."]],
["Reading the results",0,"ul",["<b>DBT</b> PT-target distance, <b>α target PT</b> azimuth, <b>pBT</b> and <b>Ps / KY</b> if a PO is entered.","<b>Firing table</b>: charge, elevation, pBC, Z (drift). The “FIRE ORDER” box can be copied or shared.","<b>ALPHA DP</b>: main direction in mil, used for pBT / pBC."]],
["Bursts and corrections",0,"ul",["<b>+ ADD A BURST</b> then CALCULATE: ΔD (shorten / lengthen) and ΔP (right / left) relative to the target.","<b>🎯 CORRECTION CALCULATION (H &amp; P)</b> gives the corrected elevation and pBC."]],
["Heights, site and trajectory",0,"ul",["<b>⛰ HEIGHTS &amp; SITE</b>: PT / target altitudes from a DEM (.tif loaded from the phone, or AUTO mode with Internet).","The topographic profile, site and ballistic trajectory open from this screen."]],
["Map and plotting",0,"ul",["<b>🗺</b> (top bar) or <b>SKETCH</b> opens the map, <u>even before calculating</u>.","Choose PT, PO, TARGET or BURST, then touch the map: the fields are filled in. NAVIGATE moves the map without placing anything.","<b>📍 GPS</b> centers the map on your position. <b>📂 MAP .tif</b> adds an offline map."]],
["Save, export, resume",0,"ul",["<b>💾 SAVE</b> adds the target to the history. Touch a target: reload it, rename it or delete it.","<b>PDF SHEET / IMAGE</b>: one page with fire order, coordinates, corrections and sketch, to share or print.","<b>KML</b> (Google Earth) and <b>GPX</b> (navigation apps) export PT, PO, target and bursts.","<b>💾 BACKUP (.json)</b> / <b>📥 RESTORE</b>: full copy of the history (phone change).","<b>Input in progress</b>: the input is kept automatically. If the app closes, “▶ RESUME” appears in the menu."]],
["Compass (mil)",0,"ul",["<b>🧭 COMPASS</b> under each azimuth field (rangefinder, cross obs., bursts): the phone sensor gives the azimuth in mil, <b>✔ USE</b> copies it into the field.","Set the <b>declination</b> (mil): the sensor measures magnetic north. Flat: top edge toward the target. Upright: back of the phone toward the target.","Limited accuracy: metal interference, “figure 8” calibration. Check with a military compass."]],
["MGRS",0,"ul",["Under each point: <b>MGRS</b> field (e.g. 31S DA 12345 67890). <b>⬇ APPLY</b> fills GEO/UTM, <b>⬆ CALCULATE</b> writes the MGRS of the point.","The MGRS also appears on the map cursor, the PDF sheet and the target plan (northern hemisphere)."]],
["Offline maps and ruler",0,"ul",["In the map: <b>📥 OFFLINE</b> saves the visible area (max 400 tiles, 3 zoom levels) of the active base map. Tiles already viewed are also kept in memory.","<b>🗺 OFFLINE MAPS</b> (menu → TOOLS) clears this memory.","<b>📏 RULER</b> plotting: touch two points to read distance (m) and azimuth (mil) there / back."]],
["Target plan",0,"ul",["Menu → <b>📑 TARGET PLAN</b>: tick the targets from the history, sort by time, name or distance, then export a <b>PDF summary</b> (several pages if needed), a <b>KML</b> or a <b>CSV</b>."]],
["QR code sharing",0,"ul",["After a calculation: <b>📲 QR</b> shows the target (PT, PO, target, bursts, charge) as a QR code.","Other phone: menu → <b>📲 IMPORT (QR)</b> → <b>📷 SCAN A QR CODE</b> (or paste the text read with the camera). The target opens in DRONE method, ready to calculate."]],
["PIN code",0,"ul",["Menu → <b>🔒 PIN CODE</b>: 4 to 6 digit code requested on opening and after 20 s in the background. 5 errors = wait 30 s or more.","The code does not encrypt data. Forgotten code: “Forgot code?” erases all application data."]],
["Good to know",0,"ul",["EAAC is a calculation aid: always check the figures according to current procedures.","Without Internet, the calculation works; only online maps and AUTO DEM require a connection."]]],
ar:[["بداية سريعة",1,"ol",["اختر <b>المنظومة</b> (2C1 أو 2C3 أو D-30).","اختر <b>الطريقة</b>: درون أو مقياس المسافة أو مراقبة متقاطعة.","أدخل المعطيات ثم اضغط <b>▶ حساب</b>.","<b>الشحنة</b>: <b>تلقائي</b> (تُختار حسب المسافة) أو <b>يدوي</b> (تختار الشحنة من القائمة؛ وإذا كان المدى خارج الحدود تُقترح الشحنات المتوافقة)."]],
["صيغ الإدخال",0,"ul",["<b>GEO</b>: «DD MM SS.ss» مثال: 36 11 24.00 (بالسالب للجنوب / الغرب).","<b>UTM</b>: الإحداثي الشرقي والشمالي والمنطقة. زر GEO/UTM يحوّل القيم.","<b>📍 GPS</b>: يملأ النقطة بموقع الهاتف (اسمح بالوصول إلى الموقع). وتظهر الدقة.","<b>السموت</b>: بالميليم (دائرة من 6000 ميليم)."]],
["طريقة الدرون",0,"ul",["أدخل PT (موقع الرمي) والهدف (الهدف المحدَّد بالدرون) بصيغة GEO أو UTM.","PO (مركز المراقبة) اختياري: استعمل زر SKIP لتجاهله."]],
["طريقة مقياس المسافة",0,"ul",["PO و PT بصيغة UTM.","الهدف: المسافة (م) والسمت (ميليم) المقاسان من PO."]],
["طريقة المراقبة المتقاطعة",0,"ul",["PO1 و PO2 و PT بصيغة UTM.","سمت (ميليم) كل مركز نحو الهدف: يقع الهدف عند تقاطع السمتين.","السموت المتوازية = لا يوجد تقاطع (رسالة خطأ)."]],
["قراءة النتائج",0,"ul",["<b>DBT</b> مسافة PT-الهدف، <b>α الهدف PT</b> السمت، <b>pBT</b> و <b>Ps / KY</b> إذا أُدخل PO.","<b>جدول الرمي</b>: الشحنة، الارتفاع، pBC، Z (الانحراف). يمكن نسخ أو مشاركة إطار «أمر الرمي».","<b>ALPHA DP</b>: الاتجاه الرئيسي بالميليم، يُستعمل في pBT / pBC."]],
["الانفجارات والتصحيحات",0,"ul",["<b>+ إضافة انفجار</b> ثم احسب: ΔD (قصّر / طوّل) و ΔP (يمين / يسار) بالنسبة للهدف.","<b>🎯 حساب التصحيح (H &amp; P)</b> يعطي الارتفاع و pBC المصحَّحين."]],
["الارتفاعات وزاوية الموقع والمسار",0,"ul",["<b>⛰ الارتفاعات وزاوية الموقع</b>: ارتفاعات PT / الهدف انطلاقاً من DEM (ملف .tif محمَّل من الهاتف، أو الوضع التلقائي مع الإنترنت).","يُفتح من هذه الشاشة المقطع الطبوغرافي وزاوية الموقع والمسار الباليستي."]],
["الخريطة والتأشير",0,"ul",["<b>🗺</b> (الشريط العلوي) أو <b>الكروكي</b> يفتح الخريطة، <u>حتى قبل الحساب</u>.","اختر PT أو PO أو الهدف أو الانفجار ثم المس الخريطة: تُملأ الحقول. «تنقّل» يحرّك الخريطة دون وضع أي نقطة.","<b>📍 GPS</b> يمركز الخريطة على موقعك. <b>📂 خريطة .tif</b> تضيف خريطة تعمل دون اتصال."]],
["الحفظ والتصدير والاستئناف",0,"ul",["<b>💾 حفظ</b> يضيف الهدف إلى السجل. المس هدفاً لإعادة تحميله أو تغيير اسمه أو حذفه.","<b>بطاقة PDF / صورة</b>: صفحة واحدة فيها أمر الرمي والإحداثيات والتصحيحات والكروكي، للمشاركة أو الطباعة.","<b>KML</b> (Google Earth) و <b>GPX</b> (تطبيقات الملاحة) يصدّران PT و PO والهدف والانفجارات.","<b>💾 نسخة احتياطية (.json)</b> / <b>📥 استعادة</b>: نسخة كاملة من السجل (عند تغيير الهاتف).","<b>إدخال غير مكتمل</b>: يُحفظ الإدخال تلقائياً. وإذا أُغلق التطبيق يظهر «▶ استئناف» في القائمة."]],
["البوصلة (ميليم)",0,"ul",["<b>🧭 البوصلة</b> تحت كل حقل سمت (مقياس المسافة، المراقبة المتقاطعة، الانفجارات): مستشعر الهاتف يعطي السمت بالميليم، و<b>✔ استخدام</b> ينسخه إلى الحقل.","اضبط <b>الانحراف المغناطيسي</b> (ميليم): المستشعر يقيس الشمال المغناطيسي. أفقياً: الحافة العلوية نحو الهدف. عمودياً: ظهر الهاتف نحو الهدف.","الدقة محدودة: التشويش المعدني والمعايرة على شكل «8». يجب التحقق ببوصلة عسكرية."]],
["MGRS",0,"ul",["تحت كل نقطة: حقل <b>MGRS</b> (مثال 31S DA 12345 67890). <b>⬇ تطبيق</b> يملأ GEO/UTM، و<b>⬆ احسب</b> يكتب MGRS للنقطة.","يظهر MGRS أيضاً على مؤشر الخريطة وبطاقة PDF ومخطط الأهداف (النصف الشمالي للكرة الأرضية)."]],
["الخرائط دون اتصال والمسطرة",0,"ul",["في الخريطة: <b>📥 دون اتصال</b> يحفظ المنطقة المرئية (400 بلاطة كحد أقصى، 3 مستويات تقريب) من الخلفية النشطة. والبلاطات التي سبق عرضها تبقى أيضاً في الذاكرة.","<b>🗺 الخرائط دون اتصال</b> (القائمة ← الأدوات) تمسح هذه الذاكرة.","التأشير بـ <b>📏 المسطرة</b>: المس نقطتين لقراءة المسافة (م) والسمت (ميليم) ذهاباً وإياباً."]],
["مخطط الأهداف",0,"ul",["القائمة ← <b>📑 مخطط الأهداف</b>: حدّد أهداف السجل، ورتّبها حسب الوقت أو الاسم أو المسافة، ثم صدّر <b>ملخص PDF</b> (عدة صفحات عند الحاجة) أو <b>KML</b> أو <b>CSV</b>."]],
["المشاركة عبر رمز QR",0,"ul",["بعد الحساب: <b>📲 QR</b> يعرض الهدف (PT و PO والهدف والانفجارات والشحنة) في رمز QR.","على الهاتف الآخر: القائمة ← <b>📲 استيراد (QR)</b> ← <b>📷 مسح رمز QR</b> (أو الصق النص المقروء بالكاميرا). يُفتح الهدف بطريقة الدرون جاهزاً للحساب."]],

/* ---------- Moteur ---------- */
var MAP={},keys=[];
D.forEach(function(r){var k=r[0].toLowerCase().replace(/\s+/g," ");MAP[k]=r;});
keys=Object.keys(MAP).sort(function(a,b){return b.length-a.length});
var RX=new RegExp(keys.map(function(k){return k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/ /g,"\\s+")}).join("|"),"gi");
var LET=/[A-Za-zÀ-ÿ\u0600-\u06FF]/;
function cased(m,t,verb){
  if(verb||lang!=="en")return t;
  var L=m.replace(/[^A-Za-zÀ-ÿ]/g,"");
  if(L.length>1&&L===L.toUpperCase())return t.toUpperCase();
  if(/^[A-ZÀ-Ý]/.test(m))return t.charAt(0).toUpperCase()+t.slice(1);
  return t;
}
function tr(s){
  if(lang==="fr"||typeof s!=="string"||!s)return s;
  var x=s;
  x=x.replace(/(\d) à (\d)/g,lang==="en"?"$1 to $2":"$1 إلى $2");
  return x.replace(RX,function(m,off,str){
    var k=m.toLowerCase().replace(/\s+/g," "),r=MAP[k];if(!r)return m;
    if(LET.test(k.charAt(0))&&off>0&&LET.test(str.charAt(off-1)))return m;
    var e=off+m.length;
    if(LET.test(k.charAt(k.length-1))&&e<str.length&&LET.test(str.charAt(e)))return m;
    return cased(m,lang==="en"?r[1]:r[2],r[3]);
  });
}

/* ---------- DOM ---------- */
var SKIP={SCRIPT:1,STYLE:1,TEXTAREA:1,CODE:1};
function skipEl(p){return !p||SKIP[p.nodeName]||(p.closest&&p.closest("[data-nox]"))||(p.nodeName==="OPTION"&&!p.hasAttribute("value"))}
function tn(n){
  var p=n.parentNode;if(skipEl(p))return;
  var d=n.data;if(n._t!==undefined&&d===n._t)return;
  if(!/\S/.test(d))return;
  n._o=d;var o=lang==="fr"?d:tr(d);
  if(o!==d){n._t=o;n.data=o}else n._t=undefined;
}
var ATT=["placeholder","title","aria-label"];
function ta(el,a){
  if(el.nodeType!==1||skipEl(el))return;
  var v=el.getAttribute(a);if(v==null)return;
  var st=el._at||(el._at={});
  if(st[a]&&st[a].t===v)return;
  var o=lang==="fr"?v:tr(v);st[a]={o:v,t:o};
  if(o!==v)el.setAttribute(a,o);
}
function walk(root){
  if(root.nodeType===3){tn(root);return}
  if(root.nodeType!==1)return;
  if(skipEl(root)&&root.nodeName!=="OPTION")return;
  var w=document.createTreeWalker(root,5,null),n=root;
  do{ if(n.nodeType===3)tn(n); else if(n.nodeType===1){ATT.forEach(function(a){if(n.hasAttribute(a))ta(n,a)})} }while((n=w.nextNode()));
}
function retranslate(){
  var w=document.createTreeWalker(document.body,5,null),n;
  while((n=w.nextNode())){
    if(n.nodeType===3){
      if(skipEl(n.parentNode))continue;
      if(n._o!==undefined&&(n._t===undefined?n.data===n._o:n.data===n._t)){var o=lang==="fr"?n._o:tr(n._o);n.data=o;n._t=(o!==n._o)?o:undefined}
      else tn(n);
    }else if(n.nodeType===1&&n._at){
      for(var a in n._at){var s=n._at[a];if(n.getAttribute(a)===s.t){var o2=lang==="fr"?s.o:tr(s.o);n.setAttribute(a,o2);s.t=o2}}
    }
  }
  walk(document.body);
}
var busy=false,mo=new MutationObserver(function(ms){
  ms.forEach(function(m){
    if(m.type==="characterData")tn(m.target);
    else if(m.type==="attributes")ta(m.target,m.attributeName);
    else m.addedNodes.forEach(walk);
  });
  inject();
});

/* ---------- Sélecteur de langue ---------- */
function inject(){

    h.appendChild(d);mark();
  }
  document.querySelectorAll(".top").forEach(function(t){
    if(t.querySelector(".lgb"))return;t.classList.add("i18n");
    var b=document.createElement("button");b.className="lgb";b.setAttribute("data-nox","");
    b.onclick=function(){I18N.cycle()};b.textContent="🌐 "+LBL[lang];t.appendChild(b);
  });
}

  document.querySelectorAll("#i18nsel button").forEach(function(b){b.className=b.dataset.l===lang?"on":""});
